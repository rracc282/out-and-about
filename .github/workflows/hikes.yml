name: Hike GPX tracks
on:
  push:
    paths: ["scripts/hikes.json", "scripts/hikes.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  hikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/hikes.mjs
      - name: Save
        run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add hikes data/hikes.json
          git diff --cached --quiet || (git commit -m "Hike tracks" && git pull --rebase -q && git push)
