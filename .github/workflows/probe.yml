name: Probe cinema sources
on:
  push:
    paths: ["scripts/probe-cinema.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-cinema.mjs
      - run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/probe-cinema.json
          git diff --cached --quiet || (git commit -m "Cinema probe" && git pull --rebase -q && git push)
