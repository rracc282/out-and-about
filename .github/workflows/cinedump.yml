name: Page dump (temporary)
on:
  push:
    paths: ["scripts/cine-dump.mjs"]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/cine-dump.mjs
      - run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cine-raw
          git diff --cached --quiet || (git commit -m "Page dump" && git pull --rebase -q && git push)
