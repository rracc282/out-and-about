name: Weather
on:
  schedule:
    - cron: "10 4-19/3 * * *"   # every 3 hours, ~06:10 to ~21:10 Zurich
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/weather.mjs
      - name: Save
        run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto.js
          git diff --cached --quiet || (git commit -m "Weather $(date +%H:%M)" && git pull --rebase -q && git push)
