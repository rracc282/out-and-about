name: Notifications
on:
  schedule:
    - cron: "0 7 * * *"   # daily reminders: 09:00 Zurich in summer, 08:00 in winter
    - cron: "0 10 * * 1"  # Monday "New this week": 12:00 / 11:00 Zurich
  workflow_dispatch:
    inputs:
      kind:
        description: "daily, weekly or test"
        default: "test"
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save web-push@3 @supabase/supabase-js@2 jsdom@24
      - run: |
          set -o pipefail
          node scripts/notify.mjs 2>&1 | tee out.txt || { grep -m3 -B3 "at new SupabaseClient" out.txt | sed "s/^/::warning::/"; exit 1; }
        env:
          TZ: Europe/Zurich
          KIND: ${{ github.event.inputs.kind || (github.event.schedule == '0 10 * * 1' && 'weekly' || 'daily') }}
          SUPABASE_URL: https://qcjtzjtkmothocfiwgxf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: BBTVEmUtIJUCFM6sUR-hZLQiHAqvoat4Qb3JBid-bEPR4aFrn_UY0zjOHhOfpKRxVoISXcg_kRaj46J1X2jgU1E
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
