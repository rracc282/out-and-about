name: Check links
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays ~03:00 Zurich, before the nightly event update
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/linkcheck.mjs
      - name: Save
        run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/links.json
          git diff --cached --quiet || (git commit -m "Link check $(date +%F)" && git pull --rebase -q && git push)
