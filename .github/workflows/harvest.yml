name: Collect events
on:
  schedule:
    - cron: "30 2 * * *"   # every night ~04:30 Zurich
  push:
    paths: ["data/curated.json", "scripts/harvest.mjs", "scripts/sources.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/harvest.mjs
      - name: Save
        run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto.js data/
          git diff --cached --quiet || (git commit -m "Nightly events $(date +%F)" && git pull --rebase -q && git push)
