name: Cinema times
on:
  schedule:
    - cron: "10 3 * * *"   # every night ~05:10 Zurich
  push:
    paths: ["scripts/cinema.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  cinema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/cinema.mjs
      - name: Save
        run: |
          git config user.name "out-and-about-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cine.js data/cine-tr.json
          git diff --cached --quiet || (git commit -m "Cinema times $(date +%F)" && git pull --rebase -q && git push)
